version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/senati_store
      - JWT_SECRET=senati_2026
    depends_on:
      - mongodb
volumes:
  mongo_data:
